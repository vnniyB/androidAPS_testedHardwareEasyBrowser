<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAPS Hardware Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/androidAPS_testedHardwareEasyBrowser/assets/index-BvAx6bGj.js"></script>
  <link rel="stylesheet" crossorigin href="/androidAPS_testedHardwareEasyBrowser/assets/index-CiI8e8Zw.css">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="logo">
        <h1>AAPS Tested Hardware Setup (Phones)</h1>
      </div>


      <nav class="header-nav">

        <a href="https://androidaps.readthedocs.io/en/latest/Getting-Started/Phones.html#list-of-tested-phones"
          target="_blank" rel="noopener noreferrer" class="nav-link">
          androidAPS Docs
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
        <a href="https://docs.google.com/spreadsheets/u/1/d/e/2PACX-1vScCNaIguEZVTVFAgpv1kXHdsHl3fs6xT6RB2Z1CeVJ561AvvqGwxMhlmSHk4J056gMCAQE02sAWJvT/pubhtml?gid=683363241&single=true"
          target="_blank" rel="noopener noreferrer" class="nav-link">
          Source Sheet
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </nav>

      <div class="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="global-search" placeholder="Search devices, pumps, or users..." />
      </div>
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Filters</h2>
          <button id="clear-filters" class="btn-text">Clear All</button>
        </div>

        <div class="filters-container">
          <div class="filter-group">
            <label for="sort-order">Sort By</label>
            <select id="sort-order">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Phone Brand</label>
            <div class="custom-select" id="brand-select-container">
              <button class="select-btn" id="brand-select-btn">Select Brands</button>
              <div class="select-options hidden" id="brand-options-list">
                <!-- Options injected by JS -->
              </div>
            </div>
            <!-- Hidden native select for reference if needed, or remove completely. Removing for cleaner implementation -->
          </div>

          <div class="filter-group">
            <label for="filter-pump">Pump</label>
            <select id="filter-pump">
              <option value="">All Pumps</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-working">Status</label>
            <select id="filter-working">
              <option value="">All Statuses</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Android Version</label>
            <div class="custom-select" id="android-select-container">
              <button class="select-btn" id="android-select-btn">Select Versions</button>
              <div class="select-options hidden" id="android-options-list">
                <!-- Options injected by JS -->
              </div>
            </div>
          </div>

          <div class="filter-group">
            <label>AAPS Version</label>
            <div class="custom-select" id="aaps-select-container">
              <button class="select-btn" id="aaps-select-btn">Select Versions</button>
              <div class="select-options hidden" id="aaps-options-list">
                <!-- Options injected by JS -->
              </div>
            </div>
          </div>

          <div class="filter-group">
            <label>CGM Brand</label>
            <div class="custom-select" id="cgm-select-container">
              <button class="select-btn" id="cgm-select-btn">Select Brands</button>
              <div class="select-options hidden" id="cgm-options-list">
                <!-- Options injected by JS -->
              </div>
            </div>
          </div>

          <div class="filter-group">
            <label>Country</label>
            <div class="custom-select" id="country-select-container">
              <button class="select-btn" id="country-select-btn">Select Countries</button>
              <div class="select-options hidden" id="country-options-list">
                <!-- Options injected by JS -->
              </div>
            </div>
          </div>


          <div class="results-meta">
            <span id="results-count">0</span> results found
          </div>


          <div class="contribute-section">
            <h3>Add your setup!</h3>
            <p>Help the community by submitting your hardware test results.</p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfoGKLYEx4aUAJ5RWL3xLJeNdmRyxtXmDzpGhuU3Rfcj2H_Jw/viewform"
              target="_blank" class="btn-primary">
              Submit Form
            </a>
            <div class="qr-code-container">
              <img src="./qr-code.png" alt="Scan to contribute" class="qr-code">
              <span>or Scan QR code to open form</span>
            </div>
          </div>

        </div>

      </aside>

      <main class="content-area">
        <div class="view-toggle-container">
          <div class="custom-select" id="column-select-container" style="flex: 1; max-width: 200px;">
            <button class="select-btn" id="column-select-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
              Columns
            </button>
            <div class="select-options hidden" id="column-options-list" style="width: 250px; right: 0; left: auto; padding: 0.5rem 0;">
              <!-- Options injected by JS -->
            </div>
          </div>
          
          <button id="view-list" class="view-toggle-btn active" title="List View">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            List
          </button>
          <button id="view-grid" class="view-toggle-btn" title="Grid View">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Cards
          </button>
        </div>

        <div id="list-container" class="list-container">
          <div class="table-responsive">
            <table class="data-table">
              <thead id="data-table-head"></thead>
              <tbody id="data-table-body"></tbody>
            </table>
          </div>
        </div>

        <div id="grid-container" class="grid-container hidden">
          <!-- Cards will be injected here -->
        </div>
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">🔍</div>
          <h3>No results found</h3>
          <p>Try adjusting your search or filters.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- Details injected here -->
      </div>
    </div>
  </div>

</body>

</html>
