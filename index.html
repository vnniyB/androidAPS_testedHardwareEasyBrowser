<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAPS Hardware Browser</title>
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="logo">
        <h1>AAPS Hardware</h1>
      </div>
      <div class="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="global-search" placeholder="Search devices, pumps, or users..." />
      </div>
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Filters</h2>
          <button id="clear-filters" class="btn-text">Clear All</button>
        </div>

        <div class="filters-container">
          <div class="filter-group">
            <label for="sort-order">Sort By</label>
            <select id="sort-order">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-brand">Phone Brand</label>
            <select id="filter-brand">
              <option value="">All Brands</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-pump">Pump</label>
            <select id="filter-pump">
              <option value="">All Pumps</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-working">Status</label>
            <select id="filter-working">
              <option value="">All Statuses</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-android">Android Version</label>
            <select id="filter-android">
              <option value="">All Versions</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-country">Country</label>
            <select id="filter-country">
              <option value="">All Countries</option>
            </select>
          </div>
        </div>

        <div class="results-meta">
          <span id="results-count">0</span> results found
        </div>
      </aside>

      <main class="content-area">
        <div id="grid-container" class="grid-container">
          <!-- Cards will be injected here -->
        </div>
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">🔍</div>
          <h3>No results found</h3>
          <p>Try adjusting your search or filters.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- Details injected here -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>

</html>
